---
apiVersion: v1
kind: Namespace
metadata:
  name: checkmk-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-cache
  namespace: checkmk-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-cache
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-cache
subjects:
  - kind: ServiceAccount
    name: metrics-cache
    namespace: checkmk-monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-cache
  namespace: checkmk-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-cache
  template:
    metadata:
      labels:
        app: metrics-cache
    spec:
      serviceAccountName: metrics-cache
      volumes:
        - name: src
          hostPath:
            path: /src
      containers:
        - name: metrics-cache
          image: cmk-rustik:1
          imagePullPolicy: Never
          args: # TODO
            - /bin/sleep
            - 24h
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 10050
          volumeMounts:
            - name: src
              mountPath: /src
