[package]
name = "metrics-cache"
version = "1.1000.0"  # must be < 2.0.0 for Checkmk to be happy.
license.workspace = true
edition.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "cmk-rustik-cache-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8" }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { workspace = true }
cmk-kube-types = { workspace = true }
futures-util = "0.3.32"
k8s-openapi = { version = "0.27.1", features = ["earliest"] }
kube = { version = "3.1", features = ["ring", "runtime"] }
moka = { version = "0.12.15", features = ["future"] }
os-release = { workspace = true }
rustls = { workspace = true }
serde = {workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
