[package]
name = "metrics-cache"
version = "1.1000.0"  # must be < 2.0.0 for Checkmk to be happy.
license.workspace = true
edition.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "cmk-rustik-cache-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { workspace = true }
cmk-kube-types = { workspace = true }
flate2 = "1.1.9"
futures-util = "0.3.32"
k8s-openapi = { version = "0.27.1", features = ["latest"] }
kube = { version = "4.0", features = ["ring", "runtime"] }
moka = { version = "0.12.15", features = ["future"] }
os-release = { workspace = true }
rcgen = "0.14.8"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "multipart", "rustls-no-provider", "system-proxy"] }
rustls = { workspace = true }
serde = {workspace = true }
serde_json = "1.0.150"
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["compression-gzip"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
