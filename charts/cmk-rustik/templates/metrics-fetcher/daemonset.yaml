apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rustik.fullname" . }}-metrics-fetcher
spec:
  selector:
    matchLabels:
      app: {{ include "rustik.fullname" . }}-metrics-fetcher
  template:
    metadata:
      labels:
        app: {{ include "rustik.fullname" . }}-metrics-fetcher
    spec:
      serviceAccountName: {{ include "rustik.fullname" . }}-metrics-fetcher
      {{- with .Values.metricsFetcher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # hostNetwork: true
      # dnsPolicy: ClusterFirstWithHostNet
      {{- if or .Values.metricsFetcher.extraVolumes .Values.intraClusterCommunication.encryption.enabled }}
      volumes:
        {{- with .Values.metricsFetcher.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.intraClusterCommunication.encryption.enabled }}
        - name: intra-cluster-ca
          secret:
            secretName: {{ include "rustik.intraClusterTLSSecretName" . }}
            items:
              - key: ca.crt
                path: intra-cluster-ca.crt
        {{- end }}
      {{- end }}
      containers:
        - name: metrics-fetcher
          image: {{ .Values.metricsFetcher.image.repository }}:{{ .Values.metricsFetcher.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.metricsFetcher.image.pullPolicy }}
          args:
            - --metrics-cache-namespace={{ .Release.Namespace }}
            - --metrics-cache-service={{ include "rustik.fullname" . }}-metrics-cache-ingest
            - --metrics-cache-port={{ .Values.metricsCache.intraClusterPort }}
            {{- if .Values.intraClusterCommunication.encryption.enabled }}
            - --metrics-cache-ca-cert-file=/etc/ssl/certs/intra-cluster-ca.crt
            {{- end }}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: {{ .Values.metricsFetcher.logLevel | default .Values.logLevel }}
          {{- if or .Values.metricsFetcher.extraVolumeMounts .Values.intraClusterCommunication.encryption.enabled }}
          volumeMounts:
            {{- with .Values.metricsFetcher.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.intraClusterCommunication.encryption.enabled }}
            - name: intra-cluster-ca
              readOnly: true
              mountPath: /etc/ssl/certs/intra-cluster-ca.crt
              subPath: intra-cluster-ca.crt
            {{- end }}
          {{- end }}
          {{- with .Values.metricsFetcher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
