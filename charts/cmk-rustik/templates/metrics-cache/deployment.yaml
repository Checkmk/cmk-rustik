apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustik.fullname" . }}-metrics-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "rustik.fullname" . }}-metrics-cache
  template:
    metadata:
      labels:
        app: {{ include "rustik.fullname" . }}-metrics-cache
    spec:
      serviceAccountName: {{ include "rustik.fullname" . }}-metrics-cache
      {{- with .Values.metricsCache.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: metrics-cache
          image: {{ .Values.metricsCache.image.repository }}:{{ .Values.metricsCache.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.metricsCache.image.pullPolicy }}
          args:
            - --address=0.0.0.0
            - --port={{ .Values.metricsCache.port }}
            - --reader-allowlist={{ .Release.Namespace }}:{{ include "rustik.fullname" . }}-metrics-cache
            - --writer-allowlist={{ .Release.Namespace }}:{{ include "rustik.fullname" . }}-metrics-fetcher
            - --cluster-name={{ required "clusterName is required (there is no safe default: it names every generated host)" .Values.clusterName }}
            - --cluster-host-name={{ required "clusterHostName is required (it must exactly match the Checkmk host representing this cluster)" .Values.clusterHostName }}
            {{- if .Values.hostLabels.importAllAnnotations }}
            {{- if .Values.hostLabels.importKeyPattern }}
            {{ fail "hostLabels.importKeyPattern should not be set while hostLabels.importAllAnnotations is true" }}
            {{- end }}
            - --import-all-annotations
            {{- else if .Values.hostLabels.importKeyPattern }}
            - --annotation-key-pattern={{ .Values.hostLabels.importKeyPattern }}
            {{- end }}
            {{- if .Values.push.enabled }}
            - --push-receiver={{ required "push.url is required when push mode is enabled" .Values.push.url }}
            {{- if .Values.push.insecureSkipSiteCaVerification }}
            - --push-registration-insecure-skip-site-ca-verification
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.emitAll }}
            {{- if $v }}
            - --all-{{ $k }}
            {{- end }}
            {{- end }}
            {{- /*
            Gated on pull.enabled too: with pull disabled, no flag and no
            shared secret env var reach the app, so it rejects all pull
            requests regardless of the authentication settings below.
            */}}
            {{- if and .Values.pull.enabled (not .Values.pull.authentication.enabled) }}
            - --disable-pull-authentication
            {{- end }}
          env:
            {{- /*
            Do NOT gate this on registrationToken, we allow admins to manually
            create the secret outside of the chart's control, and the env var
            should still exist in this case.
            */}}
            {{- if .Values.push.enabled }}
            - name: CMK_PUSH_AGENT_RECEIVER_OTT
              valueFrom:
                secretKeyRef:
                  name: {{ include "rustik.fullname" . }}-push-registration
                  key: token
                  optional: true
            - name: CMK_PUSH_AGENT_RECEIVER_SITE_CA_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "rustik.fullname" . }}-push-registration
                  key: site-ca-pem
                  optional: true
            {{- end }}
            {{- /*
            If the env var isn't set, the app will block all pull-related
            requests. Thus we gate the env binding based on pull.enabled
            which has the effect of gating pull functionality.
            */}}
            {{- if and .Values.pull.enabled .Values.pull.authentication.enabled }}
            - name: CMK_PULL_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rustik.pullSharedSecretName" . }}
                  key: {{ include "rustik.pullSharedSecretKey" . }}
            {{- end }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: {{ .Values.metricsCache.logLevel | default .Values.logLevel }}
          ports:
            - containerPort: {{ .Values.metricsCache.port }}
          {{- with .Values.metricsCache.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metricsCache.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
