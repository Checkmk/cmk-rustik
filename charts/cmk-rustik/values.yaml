# clusterName is the name which is part of every piggyback host that gets
# created in Checkmk as a result of monitoring this cluster. If migrating from
# the legacy Kubernetes monitoring, it should _exactly_ match what was in your
# old Kubernetes rule so that your monitored objects retain rules and historical
# data. This value is required.
clusterName: ""

# clusterHostName is the name of the Checkmk host which represents the cluster
# as a whole. It is almost always the host that has the special agent rule
# attached to it in pull-mode, or that the agent is registered to for push-mode.
# It must match *exactly* the name of the host in Checkmk. This value is
# required.
clusterHostName: ""

# logLevel is the default log level for metrics-cache and metrics-fetcher.
# It can be overridden per component via metricsCache.logLevel or
# metricsFetcher.logLevel.
logLevel: info

# metricsFetcher defines settings that control the daemon running on each
# node in the cluster, collecting (or "fetching") metrics about the node's
# kubelet and running the Checkmk agent on the node.
metricsFetcher:
  # image allows you to override the metrics-fetcher container image properties.
  image:
    # repository is the registry path and image name, without the tag.
    repository: ghcr.io/checkmk/cmk-rustik-metrics-fetcher
    # tag is the image tag or version to use. It defaults to the app version.
    tag: ""
    # pullPolicy defines when and if Kubernetes should repull.
    pullPolicy: IfNotPresent

  # resources lets you limit and request cluster resources for metrics-fetcher.
  # see: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    limits:
      cpu: 100m
      memory: 32Mi
    requests:
      cpu: 50m
      memory: 16Mi

  # logLevel controls how verbose metrics-fetcher is when writing to stderr.
  # Inherits top-level logLevel by default.
  logLevel: ""

  # extraVolumes is volume definitions to add to the Pod in the Deployment.
  extraVolumes: []
  # extraVolumeMounts is volume mounts to mount in the metrics-fetcher container.
  extraVolumeMounts: []

# metricsCache defines settings that control the daemon caching all information
# about the cluster and serving that information to Checkmk for monitoring.
metricsCache:
  # image allows you to override the metrics-cache container image properties.
  image:
    # repository is the registry path and image name, without the tag.
    repository: ghcr.io/checkmk/cmk-rustik-metrics-cache
    # tag is the image tag or version to use. It defaults to the app version.
    tag: ""
    # pullPolicy defines when and if Kubernetes should repull.
    pullPolicy: IfNotPresent

  # service configures the ports exposed by the Kubernetes Services in front
  # of metrics-cache. The pull Service may be exposed as a NodePort; the
  # intra-cluster ingestion Service is always a ClusterIP.
  service:
    type: ClusterIP
    # pullPort is the port exposed by the pull Service.
    pullPort: 10050
    # intraClusterPort is the port exposed by the ingestion Service.
    intraClusterPort: 10049
    # nodePort is the external pull port and is required when type is NodePort.
    nodePort: null

  # resources lets you limit and request cluster resources for metrics-cache.
  # see: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 150m
      memory: 200Mi

  # pullPort is the container port on which metrics-cache serves pull requests.
  # The pull Service targets this port.
  pullPort: 10050

  # intraClusterPort is the container port on which metrics-cache accepts data
  # from metrics-fetcher. The ingestion Service targets this port.
  intraClusterPort: 10049

  # logLevel controls how verbose metrics-cache is when writing to stderr.
  # Inherits top-level logLevel by default.
  logLevel: ""

  # kubeletStatsCacheTtl is how long (seconds) kubelet stats entries are
  # persisted in the cache before expiring.
  kubeletStatsCacheTtl: 120

  # systemAgentCacheTtl is how long (seconds) system agent entries are
  # persisted in the cache before expiring.
  systemAgentCacheTtl: 120

  # kubeletHealthCacheTtl is how long (seconds) kubelet health entries are
  # persisted in the cache before expiring.
  kubeletHealthCacheTtl: 120

  # extraVolumes is volume definitions to add to the Pod in the Deployment.
  extraVolumes: []
  # extraVolumeMounts is volume mounts to mount in the metrics-cache container.
  extraVolumeMounts: []

  # apiHealthPollInterval is the number of seconds in between polling the
  # Kubernetes API server /livez and /readyz health endpoints, used in reporting
  # overall cluster health. Should be lower than push.interval if push mode is
  # used and lower than your check interval if pull mode is used.
  apiHealthPollInterval: 45

# push allows you to enable, disable, and configure push mode; pushing data
# *into* Checkmk from the cluster.
push:
  # enabled controls whether push mode is activated or not.
  enabled: false
  # registrationToken is a one-time token issued by Checkmk, normally set one
  # time when you initially install the chart, by using --set on the helm CLI.
  # You typically should not override this in your own values.yaml. It is only
  # used once, to allow the agent to register itself with Checkmk's push-agent
  # receiver. A temporary Secret will be created for internal use, when this is
  # set.
  registrationToken: ""
  # url is the url of the push-agent receiver for your site. It *includes* the
  # site name. Example: https://example.com:8000/production
  url: ""
  # siteCaCertificate is the PEM-encoded certificate of the Checkmk site CA.
  # Used for registering to the Checkmk site's push-agent receiver service.
  # It can be found in Setup > Certificate overview, with description
  # "Signing the site certificate" and path ending "/ssl/ca.pem". If using helm
  # directly from the command line, you can pass this in with:
  # --set-file push.siteCaCertificate
  siteCaCertificate: ""
  # insecureSkipSiteCaVerification *should NOT* ever be set to `true` in
  # production. It provides an escape hatch primarily for development of the
  # agent itself or for environments that do not care about potential
  # man-in-the-middle attacks (which could expose your one-time registration
  # token to an attacker who could then register as your cluster). You have
  # been warned. When set to true, will trust whatever push-agent receiver
  # answers at the configured URL, without verifying its identity.
  insecureSkipSiteCaVerification: false
  # interval is how often, in seconds, sections are generated and pushed to
  # the Checkmk site. Must be greater than zero.
  interval: 60

# pull allows you to configure pull mode, so that Checkmk's special agent can
# query the agent directly.
pull:
  # enabled controls whether pull mode is activated or not. If false, all
  # requests to the pull endpoint(s) will return HTTP 401.
  enabled: false
  # authentication controls the shared secret used by the Checkmk special agent.
  authentication:
    # enabled allows you to control if authentication is required for accessing
    # the pull-mode endpoints at all. For production, you should generally keep
    # this enabled as otherwise cluster-monitoring could publicly expose
    # information about your environment.
    enabled: true

    # existingSecret references a Kubernetes secret (and the key within it)
    # holding the shared secret. The secret must already exist; the chart does
    # not create it for you in this case.
    existingSecret:
      name: ""
      key: secret

    # insecureRawSecretString *should NOT* be used in production.
    # It allows for setting the shared secret directly from the Helm variables,
    # which can be useful for development or debugging, but ends up storing the
    # shared secret in plain text (obtainable easily via `helm get values` for
    # example). When this is set, a secret containing the value is created for
    # you.
    # Set exactly one of existingSecret.name or insecureRawSecretString;
    # setting both (or neither) while authentication is enabled is an error.
    # insecureRawSecretString: "very_s3cret!!!"

  # encryption configures TLS for the pull listener. If existingSecret is
  # empty, metrics-cache creates and reuses a Secret containing a CA and server
  # certificate. If existingSecret is set, it must already exist and contain
  # tls.crt and tls.key; metrics-cache will not generate or replace it.
  # When the pull Service is a NodePort, existingSecret is required because the
  # generated certificate only contains cluster-internal DNS names.
  encryption:
    enabled: false
    existingSecret: ""
    # longevity is the validity of an automatically generated CA and server
    # certificate, in days. It is ignored when existingSecret is set.
    longevity: 3650

# otel allows you to enable, disable, and configure the OpenTelemetry export.
# Unlike push mode, this does not send Checkmk sections: it exports pod- and
# container-level metrics derived from the kubelet data, using OTLP over HTTP.
otel:
  # enabled controls whether the OpenTelemetry export is activated or not.
  enabled: false
  # endpoint is the base URL of an OpenTelemetry collector's OTLP/HTTP receiver.
  # Do *not* include the signal path: "/v1/metrics" is appended for you.
  # Required when otel.enabled is true.
  endpoint: ""
  # interval is how often, in seconds, metrics are collected and exported to
  # the collector. Must be greater than zero.
  interval: 60

# hostLabels defines how annotations get imported as labels in Checkmk. By
# default annotations do not become host labels.
hostLabels:
  # importAllAnnotations imports every annotation (whose value is a valid
  # label value) as a host label. Must not be combined with importKeyPattern.
  importAllAnnotations: false
  # importKeyPattern imports only annotations whose key matches this regex.
  # Empty means no annotations are imported.
  importKeyPattern: ""

# emitAll allows you to set which kinds have ALL of their resources turned into
# piggyback hosts in Checkmk. Resources not enabled here can be opted in via an
# annotation (checkmk.com/promote-to-host: "true"). By default, pods are not
# emitted by default, everything else is.
emitAll:
  pods: false
  namespaces: true
  nodes: true
  deployments: true
  daemonsets: true
  statefulsets: true
  cronjobs: true

# intraClusterCommunication configures communication between metrics-fetcher
# and metrics-cache. Encryption is enabled by default.
intraClusterCommunication:
  # encryption configures TLS for the ingestion listener. If existingSecret is
  # empty, metrics-cache creates and reuses a Secret containing a CA and server
  # certificate. If existingSecret is set, it must already exist and contain
  # tls.crt, tls.key, and ca.crt; metrics-cache will not generate or replace it.
  encryption:
    enabled: true
    existingSecret: ""
    # longevity is the validity of an automatically generated CA and server
    # certificate, in days. It is ignored when existingSecret is set.
    longevity: 3650
