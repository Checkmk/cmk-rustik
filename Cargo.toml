[workspace]
resolver = "3"
members = ["metrics-cache", "metrics-fetcher"]

[workspace.package]
version = "2.0.0"
license = "GPL-2.0-only"
edition = "2024"
readme = "README.md"
homepage = "https://www.checkmk.com/"
repository = "https://github.com/checkmk/cmk-rustik"

[workspace.dependencies]
anyhow = { version = "1.0" }
clap = { version = "4.6", features = ["cargo", "derive", "env", "wrap_help"] }
os-release = { version = "0.1" }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = { version = "2.0" }
tokio = { version = "1.52", features = ["fs", "macros", "rt-multi-thread"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = "deny"
redundant_clone = "deny"
wildcard_dependencies = "deny"
unwrap_used = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true