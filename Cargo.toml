[workspace]
resolver = "3"
members = ["metrics-cache", "metrics-fetcher", "lib"]

[workspace.package]
version = "2.0.0"
license = "GPLv2"
edition = "2024"
readme = "README.md"
homepage = "https://www.checkmk.com/"
repository = "https://github.com/checkmk/cmk-rustik"

[workspace.dependencies]
anyhow = { version = "1.0" }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
cmk-kube-types = { path = "lib", version = "2.0.0" }
tokio = { version = "1.52", features = ["rt-multi-thread"] }