kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.36.1
  extraPortMappings:
  - containerPort: 30050
    hostPort: 30050
    listenAddress: 0.0.0.0
    protocol: tcp
  extraMounts:
  - hostPath: "$SRC_DIR$"
    containerPath: /src
# Enable swap for testing swap sections
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    failSwapOn: false
    memorySwap:
      swapBehavior: LimitedSwap
