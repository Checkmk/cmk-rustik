name: helm chart

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  helm:
    # Only publish the chart if CI and the image builds it references succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/setup-helm@v5.0.1
      - run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - name: Package and push
        run: |
          helm package charts/cmk-rustik \
            --version 0.0.0-master \
            --app-version "sha-${{ github.event.workflow_run.head_sha || github.sha }}"
          helm push cmk-rustik-0.0.0-master.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts
