---
name: Reusable image build workflow

# Builds and pushes the component images for master and tagged releases.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        component: [metrics-cache, metrics-fetcher]
    uses: docker/github-builder/.github/workflows/build.yml@v1.12.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: docker/Dockerfile
      cache: ${{ github.ref_type == 'branch' }}
      cache-scope: ${{ matrix.component }}
      cache-mode: max
      target: ${{ matrix.component }}
      set-meta-labels: true
      set-meta-annotations: true
      build-args: |
        RUSTIK_GIT_SHA=${{ github.sha }}
      meta-images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
      # Releases get only the full x.y.z version, without moving version aliases.
      meta-flavor: latest=false
      meta-tags: |
        type=sha,format=long
        type=ref,event=branch
        type=semver,pattern={{version}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
