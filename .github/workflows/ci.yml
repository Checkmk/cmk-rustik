---
name: CI

on:
  push:
    branches:
      - '**'  # ignore tags - release.yml handles them (eventually)
      - '!gh-pages'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
  images:
    # Only publish images once CI is green, and never for pull requests
    # (fork PRs must not get registry credentials anyway).
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/images-reusable.yml
    permissions:
      contents: read
      id-token: write
      packages: write
  helm:
    # Only release the helm chart once images have been successfully pushed
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        version:
          - 0.0.0-master
          # Master alias for the next Checkmk minor release. When Checkmk branches,
          # bump this to the next minor version (e.g. 3.1.0 after branching 3.0).
          - "3.0.0"
    uses: ./.github/workflows/helm-release-reusable.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ matrix.version }}
