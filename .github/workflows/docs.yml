---
name: Docs

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

# Pages must use "Deploy from a branch": gh-pages, / (root).
permissions:
  contents: write

# Serialize updates to gh-pages with release SBOM publication.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sbom:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/sbom-reusable.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      version: master

  build:
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # .cargo/config.toml pins build.target to musl, so cargo doc emits its
      # output under this target-specific directory, not plain target/doc.
      DOC_DIR: target/x86_64-unknown-linux-musl/doc
      PAGES_UPDATE_DIR: pages-update
      SOURCE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-unknown-linux-musl
      - name: Work around Azure issues
        run: sudo sed -i 's/azure\.archive/archive/g' /etc/apt/apt-mirrors.txt
      - name: Install musl C toolchain
        # cargo doc still *compiles* deps (running their build scripts) to
        # document our crates. ring's build script needs the musl C compiler
        # for the musl target, even though no final binary is linked.
        run: sudo apt update && sudo apt install -y musl-tools
      - name: Build rustdoc
        # --workspace: document all member crates (lib, metrics-cache, metrics-fetcher)
        # --no-deps: skip third-party deps, only our own crates
        # --document-private-items: this is an internal maintenance doc site
        run: cargo doc --workspace --no-deps --document-private-items
      - name: Stage rustdoc
        # cargo doc produces no top-level index.html for a workspace, so point
        # the Pages root at the primary crate (hyphen -> underscore in the path).
        run: |
          echo '<meta http-equiv="refresh" content="0; url=metrics_cache/index.html">' \
            > "$DOC_DIR/index.html"
          mkdir -p "$PAGES_UPDATE_DIR"
          cp -a "$DOC_DIR/." "$PAGES_UPDATE_DIR/"
          touch "$PAGES_UPDATE_DIR/.nojekyll"
      - uses: actions/download-artifact@v4
        with:
          name: rustik-sbom-master
          path: ${{ env.PAGES_UPDATE_DIR }}/sbom/master
      - name: Persist Pages site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ env.PAGES_UPDATE_DIR }}
          clean: true
          clean-exclude: |
            sbom
            sbom/**
          commit-message: Update docs and master SBOMs for ${{ env.SOURCE_REF }}
