---
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  preflight:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check that tag matches Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo pkgid -p metrics-fetcher | cut -d'#' -f2)
          if [[ "$version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version $version"
            exit 1
          fi

  ci:
    name: Run CI
    needs: preflight
    uses: ./.github/workflows/ci-reusable.yml

  images:
    name: Publish images
    needs: ci
    uses: ./.github/workflows/images-reusable.yml
    permissions:
      contents: read
      id-token: write
      packages: write

  helm:
    name: Publish Helm chart
    needs: images
    uses: ./.github/workflows/helm-release-reusable.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ github.ref_name }}

  sbom:
    name: Generate SBOMs
    needs: ci
    uses: ./.github/workflows/sbom-reusable.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ github.ref_name }}

  github-release:
    name: Create GitHub release
    needs: [images, helm, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rustik-sbom-${{ github.ref_name }}
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          # Different compatibility lines can release independently.
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*-bom.xml

  publish-sbom:
    # Pages must use "Deploy from a branch": gh-pages, / (root).
    name: Publish release SBOMs
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PAGES_UPDATE_DIR: pages-update
      RELEASE_VERSION: ${{ github.ref_name }}
      SBOM_DOWNLOAD_DIR: release-sbom
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: rustik-sbom-${{ github.ref_name }}
          path: ${{ env.SBOM_DOWNLOAD_DIR }}
      - name: Stage release SBOMs
        run: |
          RELEASE_LINE="${RELEASE_VERSION%.*}"
          exact_dir="$PAGES_UPDATE_DIR/sbom/$RELEASE_LINE/$RELEASE_VERSION"
          latest_dir="$PAGES_UPDATE_DIR/sbom/$RELEASE_LINE/latest"
          mkdir -p "$exact_dir" "$latest_dir"
          touch "$PAGES_UPDATE_DIR/.nojekyll"
          cp -a "$SBOM_DOWNLOAD_DIR/." "$exact_dir/"
          # latest follows the most recently published release in this line.
          cp -a "$SBOM_DOWNLOAD_DIR/." "$latest_dir/"
      - name: Persist release SBOMs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ env.PAGES_UPDATE_DIR }}
          clean: false
          commit-message: Publish SBOMs for ${{ env.RELEASE_VERSION }}
