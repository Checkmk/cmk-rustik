name: images

on:
  push:
    branches: ['**']
    tags: ['*']

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        component: [metrics-cache, metrics-fetcher]
    uses: docker/github-builder/.github/workflows/build.yml@v1.12.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: docker/Dockerfile
      cache: ${{ github.ref_type == 'branch' }}
      cache-scope: ${{ matrix.component }}
      meta-images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
      meta-tags: |
        type=sha,format=long
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
